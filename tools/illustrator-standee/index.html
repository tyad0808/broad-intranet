<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>등신대</title>
<style>
  body { margin: 0; padding: 8px 10px; background: #323232; color: #ddd; font: 11px sans-serif; }
  h1 { font-size: 12px; color: #eee; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  #ver { color: #777; font-size: 10px; font-weight: normal; }
  button { width: 100%; margin: 4px 0; padding: 7px 4px; border: 1px solid #2d6fd1; border-radius: 3px;
           background: #2d6fd1; color: #fff; cursor: pointer; font-size: 12px; font-weight: bold; }
  button:hover { filter: brightness(1.15); }
  .f { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; }
  .f input { width: 56px; background: #1e1e1e; color: #eee; border: 1px solid #555; padding: 2px 4px; font-size: 11px; }
  .hint { color: #999; font-size: 10px; line-height: 1.4; margin: 6px 0; }
  #msg { padding: 6px 0; line-height: 1.4; white-space: pre-line; }
  #msg.err { color: #ff8a80; }
  #msg.ok { color: #9ccc65; }
</style>
</head>
<body>
  <h1>등신대 <span id="ver"></span></h1>
  <button id="make">외곽선 만들기</button>
  <div class="f">외곽선 (mm) <input id="outlineMm" type="number" step="1" min="1" value="10"></div>
  <div class="f">예각 정리 (mm) <input id="roundMm" type="number" step="1" min="0" value="10"></div>
  <p class="hint">누끼 딴 PNG(배경 투명, 파일 &gt; 가져오기에서 '링크' 켜고)를 하나 선택하고 누릅니다. 사람 둘레로 외곽선만큼 흰 면을 이미지 뒤에 깔고, 발 아래는 일자로 자르고, 다리 사이·팔 옆처럼 좁은 틈과 예각은 '예각 정리' 크기만큼 메웁니다 (0 이면 메우지 않음). 같은 모양 칼선(CutContour)은 '칼선' 레이어에. 1:1 파일 기준.</p>
  <div id="msg"></div>
  <script src="standee-shape.js"></script>
  <script src="panel.js"></script>
</body>
</html>
