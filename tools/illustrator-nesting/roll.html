<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>용지 폭 네스팅</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-fn="nestPanelRoll" data-store="roll">
  <h1>용지 폭 네스팅</h1>
  <fieldset>
    <legend>용지 (mm)</legend>
    <div class="num">용지 폭 <input data-opt="widthMm" type="number" step="10" min="1" value="1200"></div>
    <div class="num">최대 길이 <input data-opt="maxLengthMm" type="number" step="100" min="1" value="5000"></div>
    <div class="num">용지 여백 <input data-opt="marginMm" type="number" step="1" min="0" value="10"></div>
    <p class="hint">최대 길이를 넘으면 다음 장(대지)으로 나눕니다. 대지는 실제로 쓴 길이만큼만 만듭니다.</p>
  </fieldset>
  <fieldset>
    <legend>배치</legend>
    <div class="num">작업물 사이 간격 (mm) <input data-opt="gapMm" type="number" step="1" min="0" value="5"></div>
    <div class="num">수량 (선택한 것마다) <input data-opt="quantity" type="number" step="1" min="1" value="1"></div>
    <label><input data-opt="allowRotate" type="checkbox" checked> 90도 돌려서 넣기 허용</label>
  </fieldset>
  <button id="run">네스팅</button>
  <p class="hint">선택한 작업물을 복제해 기존 대지 오른쪽의 새 대지에 배치합니다. 원본은 그대로. 클리핑 마스크는 마스크 모양 기준.</p>
  <div id="msg"></div>
  <script src="panel.js"></script>
</body>
</html>
