<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>아크릴 텍스트 네스팅</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-fn="nestPanelText" data-store="text">
  <h1>아크릴 텍스트 네스팅</h1>
  <fieldset>
    <legend>원판 (mm)</legend>
    <div class="num">가로 <input data-opt="sheetWMm" type="number" step="10" min="1" value="900"></div>
    <div class="num">세로 <input data-opt="sheetHMm" type="number" step="10" min="1" value="600"></div>
    <div class="num">원판 여백 <input data-opt="marginMm" type="number" step="1" min="0" value="5"></div>
  </fieldset>
  <fieldset>
    <legend>나누기</legend>
    <label><input data-opt="unit" type="radio" name="unit" value="glyph" checked> 글자 단위 (한 글자씩)</label>
    <label><input data-opt="unit" type="radio" name="unit" value="piece"> 조각 단위 (떨어지는 획마다)</label>
    <p class="hint">조각 단위: '한' 의 ㅎ·ㅏ·ㄴ 처럼 떨어진 획을 따로 배치해 원판을 더 아낍니다. 'ㅇ' 의 구멍은 바깥 획과 함께 갑니다.</p>
  </fieldset>
  <fieldset>
    <legend>배치</legend>
    <div class="num">글자 사이 간격 (mm) <input data-opt="gapMm" type="number" step="0.5" min="0" value="3"></div>
    <div class="num">세트 수량 <input data-opt="quantity" type="number" step="1" min="1" value="1"></div>
    <label><input data-opt="allowRotate" type="checkbox" checked> 90도 돌려서 넣기 허용</label>
    <label><input data-opt="laserLine" type="checkbox" checked> 레이저 선으로 (면 없음, 빨강 0.1pt)</label>
  </fieldset>
  <button id="run">네스팅</button>
  <p class="hint">글자가 있던 자리(왼쪽 위)부터 원판을 아래로 이어 놓고, 원판 범위는 안내선으로 그립니다. 대지는 만들지 않습니다. 살아있는 글자는 아웃라인으로 바꾸고, 원본은 숨긴 '네스팅 전 원본' 레이어로 옮겨 둡니다.</p>
  <div id="msg"></div>
  <script src="panel.js"></script>
</body>
</html>
